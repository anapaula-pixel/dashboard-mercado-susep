<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mercado Akad</title>
<meta name="description" content="Dados de mercado dos ramos em que a Akad Seguros atua, a partir do SES/SUSEP.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%23DA0A5B%22/%3E%3Cpath d=%22M9 23V9h4v5l5-5h5l-7 7 7 7h-5l-5-5v5z%22 fill=%22%23fff%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="pular" href="#conteudo">Pular para o conteúdo</a>
<header class="topo">
  <div class="topo-in">
    <a class="marca" href="#geral" aria-label="Mercado Akad, início">
      <span class="selo" aria-hidden="true">akad</span>
      <span class="marca-nome">Mercado</span>
    </a>
    <nav class="nav" aria-label="Páginas do dashboard">
      <a href="#geral" data-aba="geral" aria-current="page">Visão geral</a>
      <a href="#linhas" data-aba="linhas">Ramos</a>
      <a href="#conc" data-aba="conc">Concorrentes</a>
      <a href="#uf" data-aba="uf">Por estado</a>
    </nav>
  </div>
</header>

<div class="filtros" id="filtros" role="search" aria-label="Filtros">
  <div class="filtros-in">
    <div class="fg fg-periodo">
      <span class="fg-rot" id="rot-periodo">Período</span>
      <button type="button" class="pp-btn" id="pp-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="pop-periodo" aria-labelledby="rot-periodo pp-main">
        <span class="pp-ico" aria-hidden="true"><svg viewBox="0 0 16 16" width="16" height="16"><rect x="1.5" y="2.5" width="13" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M1.5 6.5h13M5 1v3M11 1v3" stroke="currentColor" stroke-width="1.4" fill="none"/></svg></span>
        <span class="pp-txt"><span class="pp-main" id="pp-main">Carregando…</span><span class="pp-sub" id="pp-sub"></span></span>
        <span class="cb-seta" aria-hidden="true"></span>
      </button>
      <div class="pop" id="pop-periodo" role="dialog" aria-label="Escolher período" hidden></div>
    </div>
    <div class="fg" id="fg-conc" hidden>
      <label class="fg-rot" for="cb-conc-in">Concorrente</label>
      <div id="cb-conc" class="cb-host"></div>
    </div>
    <div class="fg" id="fg-linha" hidden>
      <label class="fg-rot" for="cb-linha-in">Ramo</label>
      <div id="cb-linha" class="cb-host"></div>
    </div>
    <p class="fg-nota" id="fg-nota">Esta página reúne todos os ramos acompanhados.</p>
    <p class="f-info" id="f-info" aria-live="polite"></p>
  </div>
</div>

<main id="conteudo" tabindex="-1">
  <h1 class="sr">Mercado Akad: dados de mercado SUSEP</h1>
  <section id="aba-geral" class="aba"></section>
  <section id="aba-linhas" class="aba" hidden></section>
  <section id="aba-conc" class="aba" hidden></section>
  <section id="aba-uf" class="aba" hidden></section>
</main>

<footer class="rodape">
  <p id="rodape-txt">Fonte: SUSEP, Sistema de Estatísticas (SES). Valores em reais correntes, sem correção pela inflação.</p>
</footer>

<div class="tip" id="tip" role="tooltip" hidden></div>
<script src="app.js"></script>
</body>
</html>
